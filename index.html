<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumen — Spaced-Repetition Learning Tracker</title>
<meta name="description" content="Track what you learn in physics, chemistry, thermodynamics, and competitive programming with a spaced-repetition review queue." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f7fb;
    --bg-elev: #ffffff;
    --bg-soft: #eef1f8;
    --text: #1a1d29;
    --text-soft: #5b6070;
    --text-faint: #8b90a0;
    --border: #e4e7f0;
    --border-soft: #eef0f6;
    --accent: #5b5bd6;
    --accent-soft: #ececfb;
    --accent-text: #4a4ac4;
    --green: #1aa672;
    --green-soft: #e3f7ef;
    --amber: #d98a00;
    --amber-soft: #fbf0d8;
    --red: #d9534f;
    --shadow: 0 1px 2px rgba(20,22,40,.04), 0 4px 16px rgba(20,22,40,.05);
    --shadow-lg: 0 8px 40px rgba(20,22,40,.12);
    --radius: 14px;
    --radius-sm: 9px;
    --maxw: 1080px;
  }
  html[data-theme="dark"] {
    --bg: #0f1117;
    --bg-elev: #181b24;
    --bg-soft: #1f2330;
    --text: #eceef5;
    --text-soft: #a4a9ba;
    --text-faint: #6f7488;
    --border: #272c3a;
    --border-soft: #20242f;
    --accent: #8b8bff;
    --accent-soft: #23233a;
    --accent-text: #aaaaff;
    --green: #3fcf8e;
    --green-soft: #16302a;
    --amber: #e6a93c;
    --amber-soft: #322a16;
    --red: #f0716d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
    --shadow-lg: 0 8px 40px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Header ---------- */
  header.app {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
    backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: var(--maxw); margin: 0 auto; padding: 14px 22px;
    display: flex; align-items: center; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #8e7bff);
    display: grid; place-items: center; color: #fff; font-size: 16px; box-shadow: 0 2px 10px rgba(91,91,214,.4);
  }
  .brand small { font-weight: 500; color: var(--text-faint); font-size: 12px; margin-left: 2px; }
  .header-spacer { flex: 1; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-soft);
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    font-size: 16px; transition: all .15s ease;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent-text); transform: translateY(-1px); }
  .notif-btn {
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-soft);
    height: 38px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 13px;
    display: flex; align-items: center; gap: 7px; transition: all .15s ease;
  }
  .notif-btn:hover { border-color: var(--accent); color: var(--accent-text); }
  .notif-btn.on { background: var(--green-soft); border-color: var(--green); color: var(--green); }

  /* ---------- Nav tabs ---------- */
  nav.tabs { max-width: var(--maxw); margin: 0 auto; padding: 0 22px; display: flex; gap: 4px; }
  nav.tabs button {
    border: none; background: none; color: var(--text-soft); font-weight: 600; font-size: 14px;
    padding: 12px 14px; border-bottom: 2px solid transparent; transition: all .15s ease; position: relative;
  }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.active { color: var(--accent-text); border-bottom-color: var(--accent); }
  nav.tabs button .badge {
    background: var(--red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px;
    padding: 1px 7px; margin-left: 6px; vertical-align: middle;
  }

  /* ---------- Layout ---------- */
  main { max-width: var(--maxw); margin: 0 auto; padding: 28px 22px 80px; }
  .view { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }
  h1.page { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
  .page-sub { color: var(--text-soft); margin: 0 0 24px; font-size: 14.5px; }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin: 32px 0 14px; }

  /* ---------- Cards ---------- */
  .card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* Dashboard stat row */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 8px; }
  .stat { padding: 18px 20px; }
  .stat .num { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .stat .lbl { color: var(--text-soft); font-size: 13px; font-weight: 500; margin-top: 7px; }
  .stat .num.accent { color: var(--accent-text); }
  .stat .num.green { color: var(--green); }
  .stat .num.amber { color: var(--amber); }

  /* Subject progress cards */
  .subj-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .subj-card { padding: 20px 22px; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
  .subj-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .subj-card .top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .subj-dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .subj-card h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .subj-card .src { color: var(--text-faint); font-size: 12.5px; margin: 2px 0 16px; }
  .subj-card .meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-soft); margin-bottom: 7px; }
  .subj-card .meta b { color: var(--text); font-weight: 700; }

  /* Progress bar */
  .bar { height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; transition: width .4s ease; }

  /* ---------- Subjects view ---------- */
  .subject-block { margin-bottom: 14px; }
  .subject-head {
    display: flex; align-items: center; gap: 13px; padding: 16px 20px; cursor: pointer; user-select: none;
  }
  .subject-head h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .subject-head .src { color: var(--text-faint); font-size: 12.5px; font-weight: 500; }
  .subject-head .pct { margin-left: auto; font-weight: 700; font-size: 14px; color: var(--text-soft); }
  .subject-head .chev { color: var(--text-faint); transition: transform .2s ease; font-size: 13px; }
  .subject-block.collapsed .chev { transform: rotate(-90deg); }
  .subject-block.collapsed .units { display: none; }
  .subject-head .minibar { width: 90px; height: 6px; }

  .units { padding: 4px 16px 16px; display: grid; gap: 12px; }
  .unit {
    border: 1px solid var(--border-soft); border-radius: var(--radius-sm); background: var(--bg);
    overflow: hidden;
  }
  html[data-theme="dark"] .unit { background: var(--bg-soft); }
  .unit-head {
    display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; user-select: none;
  }
  .unit-head .u-title { font-weight: 650; font-size: 15px; }
  .unit-head .u-chap { color: var(--text-faint); font-size: 12px; font-weight: 500; margin-top: 1px; }
  .unit-head .u-prog { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .unit-head .u-count { font-size: 12px; color: var(--text-soft); font-weight: 600; white-space: nowrap; }
  .unit-head .minibar { width: 70px; height: 6px; }
  .unit-head .chev { color: var(--text-faint); font-size: 12px; transition: transform .2s ease; }
  .unit.open .chev { transform: rotate(90deg); }
  .unit-body { display: none; padding: 4px 16px 18px; border-top: 1px solid var(--border-soft); }
  .unit.open .unit-body { display: block; }

  .submod { display: flex; align-items: flex-start; gap: 11px; padding: 9px 4px; border-bottom: 1px solid var(--border-soft); }
  .submod:last-child { border-bottom: none; }
  .submod label { display: flex; align-items: flex-start; gap: 11px; cursor: pointer; font-size: 14px; flex: 1; }
  .submod input { display: none; }
  .checkbox {
    width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); flex: none; margin-top: 1px;
    display: grid; place-items: center; transition: all .15s ease; color: #fff; font-size: 12px;
  }
  .submod input:checked + .checkbox { background: var(--green); border-color: var(--green); }
  .submod input:not(:checked) + .checkbox { color: transparent; }
  .submod input:checked ~ .sm-text { color: var(--text-faint); text-decoration: line-through; }
  .sm-text { padding-top: 1px; }

  .unit-meta { margin-top: 16px; display: grid; gap: 16px; }
  .meta-box { background: var(--bg-elev); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 14px 16px; }
  .meta-box h4 { margin: 0 0 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); font-weight: 700; }
  .book-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .book-chip {
    font-size: 12.5px; background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 7px; padding: 4px 10px;
  }
  .book-chip b { font-weight: 650; }
  .book-chip span { color: var(--text-soft); }
  .link-list { display: grid; gap: 7px; }
  .link-list a { font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .link-list a .ext { color: var(--text-faint); font-size: 11px; }
  .vocab-list { display: flex; flex-wrap: wrap; gap: 7px; }
  .vocab-pill {
    font-size: 12.5px; background: var(--accent-soft); color: var(--accent-text); border-radius: 999px; padding: 4px 12px; font-weight: 500;
  }

  /* ---------- Review view ---------- */
  .review-col { display: grid; gap: 12px; }
  .review-item {
    display: flex; align-items: center; gap: 14px; padding: 15px 18px;
  }
  .review-item .ri-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; font-size: 17px; }
  .review-item .ri-main { flex: 1; min-width: 0; }
  .review-item .ri-title { font-weight: 600; font-size: 14.5px; }
  .review-item .ri-sub { color: var(--text-faint); font-size: 12.5px; margin-top: 2px; }
  .review-item .ri-due { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .due-now { background: var(--red); color: #fff; }
  .due-soon { background: var(--amber-soft); color: var(--amber); }
  .btn {
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); font-weight: 600; font-size: 13px;
    padding: 8px 15px; border-radius: 9px; transition: all .15s ease; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .vocab-review-card { padding: 18px 20px; }
  .vocab-review-card .vr-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .vocab-review-card .vr-head .ri-sub { color: var(--text-faint); font-size: 12.5px; }
  .vocab-review-card .terms { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .vocab-review-card .terms .vocab-pill { font-size: 13.5px; padding: 6px 14px; }

  .empty { text-align: center; padding: 54px 20px; color: var(--text-faint); }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .empty p { margin: 4px 0; }

  /* ---------- About ---------- */
  .prose { max-width: 720px; }
  .prose h2 { font-size: 19px; font-weight: 700; margin: 28px 0 10px; letter-spacing: -.01em; }
  .prose p, .prose li { color: var(--text-soft); font-size: 15px; }
  .prose ol, .prose ul { padding-left: 22px; }
  .prose li { margin: 6px 0; }
  .interval-pills { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .interval-pills .ip { background: var(--accent-soft); color: var(--accent-text); border-radius: 9px; padding: 8px 14px; font-weight: 700; font-size: 14px; text-align: center; }
  .interval-pills .ip small { display: block; font-weight: 500; color: var(--text-soft); font-size: 11px; }

  /* ---------- Toast ---------- */
  #toaster { position: fixed; bottom: 22px; right: 22px; z-index: 100; display: grid; gap: 10px; max-width: 340px; }
  .toast {
    background: var(--bg-elev); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    box-shadow: var(--shadow-lg); border-radius: 11px; padding: 13px 16px; animation: slidein .3s ease;
  }
  .toast.success { border-left-color: var(--green); }
  .toast .t-title { font-weight: 700; font-size: 13.5px; }
  .toast .t-body { font-size: 13px; color: var(--text-soft); margin-top: 3px; }
  @keyframes slidein { from { opacity: 0; transform: translateX(40px);} to { opacity: 1; transform: none; } }

  .danger-link { background: none; border: none; color: var(--text-faint); font-size: 12.5px; text-decoration: underline; padding: 0; }
  .danger-link:hover { color: var(--red); }

  @media (max-width: 760px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .subj-grid { grid-template-columns: 1fr; }
    .brand small { display: none; }
    main { padding: 22px 16px 80px; }
    .header-inner, nav.tabs { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header class="app">
  <div class="header-inner">
    <div class="brand">
      <span class="logo">✦</span>
      <span>Lumen <small>spaced-repetition learning tracker</small></span>
    </div>
    <span class="header-spacer"></span>
    <button class="notif-btn" id="notifBtn" title="Enable browser reminders">
      <span id="notifIcon">🔔</span><span id="notifLabel">Reminders</span>
    </button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="subjects">Subjects</button>
    <button data-tab="review">Review Queue <span class="badge" id="reviewBadge" style="display:none">0</span></button>
    <button data-tab="about">How it works</button>
  </nav>
</header>

<main id="main"></main>
<div id="toaster"></div>

<script>
"use strict";
/* ============================================================
   LUMEN — single-file spaced-repetition learning tracker
   Subjects → Units → Submodules, all state in localStorage.
   Curriculum seeded from real textbook / ladder structures.
   ============================================================ */

/* ---------- Curriculum data ----------
   Each unit: { id, title, chap (multi-textbook mapping array),
                vocab[], links[], submods[] } */
const CURRICULUM = [
  {
    id: "physics", name: "Physics", icon: "🪐", color: "#5b8def",
    source: "Giancoli — Physics: Principles with Applications",
    units: [
      {
        id: "ph-measure", title: "Introduction & Measurement",
        chap: [["Giancoli","Ch. 1"],["Halliday/Resnick","Ch. 1"],["Serway/Vuille","Ch. 1"]],
        vocab: ["Significant figures","SI units","Dimensional analysis","Order of magnitude","Uncertainty","Scientific notation"],
        links: [
          ["Khan Academy — Units & measurement","https://www.khanacademy.org/science/physics/one-dimensional-motion"],
          ["HyperPhysics — Units","http://hyperphysics.phy-astr.gsu.edu/hbase/units.html"],
          ["NIST — SI units reference","https://www.nist.gov/pml/owm/metric-si/si-units"]
        ],
        submods: ["Significant figures & precision","SI base & derived units","Unit conversion & dimensional analysis","Order-of-magnitude estimation","Measurement uncertainty"]
      },
      {
        id: "ph-kin1d", title: "Kinematics in One Dimension",
        chap: [["Giancoli","Ch. 2"],["Halliday/Resnick","Ch. 2"],["Serway/Vuille","Ch. 2"]],
        vocab: ["Displacement","Velocity","Acceleration","Free fall","Kinematic equations","Instantaneous velocity"],
        links: [
          ["Khan Academy — One-dimensional motion","https://www.khanacademy.org/science/physics/one-dimensional-motion"],
          ["HyperPhysics — Motion","http://hyperphysics.phy-astr.gsu.edu/hbase/mot.html"],
          ["MIT 8.01 Classical Mechanics","https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/"]
        ],
        submods: ["Distance vs. displacement","Average vs. instantaneous velocity","Acceleration","Kinematic equations (constant a)","Free fall & gravity","Velocity-time graphs"]
      },
      {
        id: "ph-kin2d", title: "Kinematics in Two Dimensions & Vectors",
        chap: [["Giancoli","Ch. 3"],["Halliday/Resnick","Ch. 4"],["Serway/Vuille","Ch. 3"]],
        vocab: ["Vector","Scalar","Projectile motion","Components","Relative velocity","Resultant"],
        links: [
          ["Khan Academy — Two-dimensional motion","https://www.khanacademy.org/science/physics/two-dimensional-motion"],
          ["HyperPhysics — Vectors","http://hyperphysics.phy-astr.gsu.edu/hbase/vect.html"]
        ],
        submods: ["Vector addition & components","Unit vectors","Projectile motion","Range & trajectory","Relative velocity"]
      },
      {

        links: [

          ["MIT 8.01 — Newton's laws","https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/"],
          ["HyperPhysics — Newton's laws","http://hyperphysics.phy-astr.gsu.edu/hbase/newt.html"]
        ],
        submods: ["Newton's first law (inertia)","Newton's second law (F = ma)","Newton's third law","Free-body diagrams","Friction (static & kinetic)","Tension & connected objects"]
      },
      {
        id: "ph-circ", title: "Circular Motion & Gravitation",
        chap: [["Giancoli","Ch. 5"],["Halliday/Resnick","Ch. 13"],["Serway/Vuille","Ch. 7"]],
        vocab: ["Centripetal acceleration","Centripetal force","Universal gravitation","Orbital velocity","Kepler's laws"],
        links: [
          ["Khan Academy — Centripetal force & gravitation","https://www.khanacademy.org/science/physics/centripetal-force-and-gravitation"],
          ["HyperPhysics — Gravity","http://hyperphysics.phy-astr.gsu.edu/hbase/grav.html"]
        ],
        submods: ["Uniform circular motion","Centripetal acceleration & force","Newton's law of universal gravitation","Satellites & orbits","Kepler's laws"]
      },
      {
        id: "ph-energy", title: "Work & Energy",
        chap: [["Giancoli","Ch. 6"],["Halliday/Resnick","Ch. 7–8"],["Serway/Vuille","Ch. 5"]],
        vocab: ["Work","Kinetic energy","Potential energy","Conservation of energy","Power","Work-energy theorem"],
        links: [
          ["Khan Academy — Work & energy","https://www.khanacademy.org/science/physics/work-and-energy"],
          ["HyperPhysics — Work & energy","http://hyperphysics.phy-astr.gsu.edu/hbase/work.html"]
        ],
        submods: ["Work done by a constant force","Work-energy theorem","Kinetic & potential energy","Conservation of mechanical energy","Power"]
      },
      {
        id: "ph-momentum", title: "Linear Momentum & Collisions",
        chap: [["Giancoli","Ch. 7"],["Halliday/Resnick","Ch. 9"],["Serway/Vuille","Ch. 6"]],
        vocab: ["Momentum","Impulse","Conservation of momentum","Elastic collision","Inelastic collision","Center of mass"],
        links: [
          ["Khan Academy — Impulse & momentum","https://www.khanacademy.org/science/physics/linear-momentum"],
          ["HyperPhysics — Momentum","http://hyperphysics.phy-astr.gsu.edu/hbase/mom.html"]
        ],
        submods: ["Momentum & impulse","Conservation of momentum","Elastic collisions","Inelastic collisions","Center of mass"]
      },
      {
        id: "ph-rot", title: "Rotational Motion",
        chap: [["Giancoli","Ch. 8"],["Halliday/Resnick","Ch. 10–11"],["Serway/Vuille","Ch. 8"]],
        vocab: ["Torque","Angular velocity","Moment of inertia","Angular momentum","Rotational kinetic energy"],
        links: [

        ],
        submods: ["Angular quantities","Torque","Moment of inertia","Rotational dynamics","Angular momentum & its conservation"]
      },
      {
        id: "ph-statics", title: "Static Equilibrium, Elasticity & Fluids",
        chap: [["Giancoli","Ch. 9–10"],["Halliday/Resnick","Ch. 12, 14"],["Serway/Vuille","Ch. 8–9"]],
        vocab: ["Equilibrium","Stress","Strain","Young's modulus","Pressure","Buoyancy","Bernoulli's principle"],
        links: [
          ["Khan Academy — Fluids","https://www.khanacademy.org/science/physics/fluids"],

/* ---------- Spaced-repetition intervals (days) ---------- */
const INTERVALS = [1, 3, 7, 16, 35];
const DAY = 86400000;
const SOON = 2 * DAY; // window for "due soon"

/* ---------- State ---------- */
const LS_KEY = "lumen.state.v1";
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return { completed: {}, reviews: {}, vocab: {}, settings: { theme: "light", notifications: false, lastNotified: 0 }, collapsed: {} };
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

/* ---------- Lookup helpers ---------- */
const UNIT_INDEX = {};
const SUBJECT_OF_UNIT = {};
CURRICULUM.forEach(subj => subj.units.forEach(u => { UNIT_INDEX[u.id] = u; SUBJECT_OF_UNIT[u.id] = subj; }));

function smKey(unitId, idx) { return unitId + "::" + idx; }
function now() { return Date.now(); }

function unitProgress(unit) {
  const total = unit.submods.length;
  let done = 0;
  for (let i = 0; i < total; i++) if (state.completed[smKey(unit.id, i)]) done++;
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}
function subjectProgress(subj) {
  let done = 0, total = 0;
  subj.units.forEach(u => { const p = unitProgress(u); done += p.done; total += p.total; });
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}
function overallProgress() {
  let done = 0, total = 0;
  CURRICULUM.forEach(s => { const p = subjectProgress(s); done += p.done; total += p.total; });
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}

/* ---------- Spaced repetition logic ---------- */
function scheduleReview(key) {
  state.reviews[key] = { stage: 0, due: now() + INTERVALS[0] * DAY, last: now() };
}
function scheduleVocab(unitId) {
  if (!state.vocab[unitId]) state.vocab[unitId] = { stage: 0, due: now() + INTERVALS[0] * DAY, last: now() };
}
function advance(entry) {
  // returns updated entry after a successful review
  const next = entry.stage + 1;
  if (next >= INTERVALS.length) {
    return { stage: next, due: null, last: now(), mastered: true };
  }
  return { stage: next, due: now() + INTERVALS[next] * DAY, last: now() };
}
function dueReviews() {
  const out = [];
  for (const key in state.reviews) {
    const r = state.reviews[key];
    if (!state.completed[key]) continue; // only review things still completed
    if (r.due == null) continue;
    if (r.due <= now() + SOON) {
      const [unitId, idxStr] = key.split("::");
      const unit = UNIT_INDEX[unitId];
      if (!unit) continue;
      out.push({ key, unit, subject: SUBJECT_OF_UNIT[unitId], label: unit.submods[+idxStr], entry: r, overdue: r.due <= now() });
    }
  }
  out.sort((a, b) => a.entry.due - b.entry.due);
  return out;
}
function dueVocab() {
  const out = [];
  for (const unitId in state.vocab) {
    const v = state.vocab[unitId];
    if (v.due == null) continue;
    if (v.due <= now() + SOON) {
      const unit = UNIT_INDEX[unitId];
      if (!unit || !unit.vocab || !unit.vocab.length) continue;
      out.push({ unitId, unit, subject: SUBJECT_OF_UNIT[unitId], entry: v, overdue: v.due <= now() });
    }
  }
  out.sort((a, b) => a.entry.due - b.entry.due);
  return out;
}
function totalDueCount() { return dueReviews().filter(r => r.overdue).length + dueVocab().filter(v => v.overdue).length; }

/* ---------- Toggle submodule ---------- */
function toggleSubmodule(unitId, idx) {
  const key = smKey(unitId, idx);
  if (state.completed[key]) {
    delete state.completed[key];
    delete state.reviews[key];
  } else {
    state.completed[key] = true;
    scheduleReview(key);
    scheduleVocab(unitId);
    onCompletion(unitId, idx);
  }
  saveState();
}

function onCompletion(unitId, idx) {
  const unit = UNIT_INDEX[unitId];
  toast("success", "Nice — checked off!", "“" + unit.submods[idx] + "” scheduled for review in 1 day.");
  // Periodic reminder: surface what's due each time something is completed
  const due = dueReviews().filter(r => r.overdue);
  const vdue = dueVocab().filter(v => v.overdue);
  const n = due.length + vdue.length;
  if (n > 0) {
    setTimeout(() => {
      toast("", "🔁 " + n + " review" + (n > 1 ? "s" : "") + " due", "Open the Review Queue to refresh them and keep them in memory.");
      maybeNotify();
    }, 900);
  }
}

/* ---------- Mark reviews done ---------- */
function markReviewDone(key) {
  const r = state.reviews[key];
  if (!r) return;
  state.reviews[key] = advance(r);
  saveState();
  const r2 = state.reviews[key];
  if (r2.mastered) toast("success", "Mastered! 🎉", "You've cleared every review interval for this item.");
  else toast("success", "Reviewed", "Next checkpoint in " + INTERVALS[r2.stage] + " days.");
  render();
}
function markReviewLater(key) {
  const r = state.reviews[key];
  if (!r) return;
  r.due = now() + DAY; // push one day
  saveState(); render();
}
function markVocabDone(unitId) {
  const v = state.vocab[unitId];
  if (!v) return;
  state.vocab[unitId] = advance(v);
  saveState();
  const v2 = state.vocab[unitId];
  if (v2.mastered) toast("success", "Vocabulary mastered ✨", "All review intervals cleared for these terms.");
  else toast("success", "Vocab refreshed", "These terms resurface in " + INTERVALS[v2.stage] + " days.");
  render();
}

/* ---------- Notifications ---------- */
function maybeNotify() {
  if (!state.settings.notifications) return;
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  if (now() - (state.settings.lastNotified || 0) < 60 * 60 * 1000) return; // at most hourly
  const count = totalDueCount();
  if (count <= 0) return;
  try {
    new Notification("Lumen — time to review", {
      body: count + " item" + (count > 1 ? "s are" : " is") + " due. Open Lumen to refresh them.",
      tag: "lumen-review"
    });
    state.settings.lastNotified = now();
    saveState();
  } catch (e) { /* ignore */ }
}
async function toggleNotifications() {
  if (typeof Notification === "undefined") { toast("", "Not supported", "This browser doesn't support notifications."); return; }
  if (state.settings.notifications) {
    state.settings.notifications = false;
    saveState(); renderNotifBtn();
    toast("", "Reminders off", "Browser pop-up reminders disabled. Your Review Queue still works.");
    return;
  }
  let perm = Notification.permission;
  if (perm !== "granted") perm = await Notification.requestPermission();
  if (perm === "granted") {
    state.settings.notifications = true; saveState(); renderNotifBtn();
    toast("success", "Reminders on", "While this tab is open, Lumen will pop up when reviews are due.");
    maybeNotify();
  } else {
    toast("", "Permission denied", "Allow notifications in your browser settings to enable reminders.");
  }
}

/* ---------- Theme ---------- */
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.settings.theme);
  document.getElementById("themeBtn").textContent = state.settings.theme === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  state.settings.theme = state.settings.theme === "dark" ? "light" : "dark";
  saveState(); applyTheme();
}

/* ---------- Toast ---------- */
function toast(kind, title, body) {
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.innerHTML = '<div class="t-title"></div><div class="t-body"></div>';
  t.querySelector(".t-title").textContent = title;
  t.querySelector(".t-body").textContent = body;
  document.getElementById("toaster").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .4s, transform .4s"; t.style.opacity = "0"; t.style.transform = "translateX(40px)"; setTimeout(() => t.remove(), 400); }, 4200);
}

/* ---------- Utilities ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function progBar(pct, color) {
  return '<div class="bar"><span style="width:' + pct + '%;background:' + (color || "var(--accent)") + '"></span></div>';
}
function relDue(ts) {
  if (ts == null) return "mastered";
  const diff = ts - now();
  if (diff <= 0) {
    const d = Math.ceil(-diff / DAY);
    if (d <= 0) return "due now";
    return "overdue " + d + "d";
  }
  const d = Math.ceil(diff / DAY);
  if (d <= 1) return "due ≤ 1d";
  return "in " + d + "d";
}
function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }

/* ---------- Router / render ---------- */
let activeTab = "dashboard";
function setTab(tab) { activeTab = tab; document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab)); render(); }

function render() {
  renderBadges();
  renderNotifBtn();
  const main = document.getElementById("main");
  if (activeTab === "dashboard") main.innerHTML = viewDashboard();
  else if (activeTab === "subjects") main.innerHTML = viewSubjects();
  else if (activeTab === "review") main.innerHTML = viewReview();
  else if (activeTab === "about") main.innerHTML = viewAbout();
  wire();
}

function renderBadges() {
  const c = totalDueCount();
  const badge = document.getElementById("reviewBadge");
  if (c > 0) { badge.style.display = ""; badge.textContent = c; } else badge.style.display = "none";
}
function renderNotifBtn() {
  const btn = document.getElementById("notifBtn");
  const on = state.settings.notifications;
  btn.classList.toggle("on", on);

}

function stat(num, lbl, cls) {

/* ---------- Wire up events ---------- */
function wire() {
  document.querySelectorAll("[data-toggle-sm]").forEach(el => {
    el.addEventListener("change", () => {
      const [uid, idx] = el.dataset.toggleSm.split("|");
      toggleSubmodule(uid, +idx);
      render();
    });
  });
  document.querySelectorAll("[data-toggle-unit]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.toggleUnit;
      const unitEl = el.closest(".unit");
      const willOpen = !unitEl.classList.contains("open");
      state.collapsed["unit:" + id] = willOpen ? false : true;
      if (state.openUnit === id && !willOpen) state.openUnit = null;
      unitEl.classList.toggle("open");
    });
  });
  document.querySelectorAll("[data-toggle-subject]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.toggleSubject;
      const block = el.closest(".subject-block");
      block.classList.toggle("collapsed");
      state.collapsed["subj:" + id] = block.classList.contains("collapsed");
      saveState();
    });
  });
  document.querySelectorAll("[data-goto-subject]").forEach(el => {
    el.addEventListener("click", () => { state.openSubject = el.dataset.gotoSubject; setTab("subjects"); setTimeout(() => scrollToSubject(el.dataset.gotoSubject), 60); });
  });
  document.querySelectorAll("[data-goto-tab]").forEach(el => {
    el.addEventListener("click", e => { e.preventDefault(); setTab(el.dataset.gotoTab); });
  });
  document.querySelectorAll("[data-review-done]").forEach(el => el.addEventListener("click", () => markReviewDone(el.dataset.reviewDone)));
  document.querySelectorAll("[data-review-later]").forEach(el => el.addEventListener("click", () => markReviewLater(el.dataset.reviewLater)));
  document.querySelectorAll("[data-vocab-done]").forEach(el => el.addEventListener("click", () => markVocabDone(el.dataset.vocabDone)));
  document.querySelectorAll("[data-vocab-study]").forEach(el => el.addEventListener("click", e => {
    e.preventDefault();
    const uid = el.dataset.vocabStudy;
    state.openUnit = uid; state.collapsed["unit:" + uid] = false;
    state.collapsed["subj:" + SUBJECT_OF_UNIT[uid].id] = false;
    setTab("subjects");
    setTimeout(() => { const u = document.querySelector('[data-unit="' + uid + '"]'); if (u) u.scrollIntoView({ behavior: "smooth", block: "center" }); }, 80);
  }));
  const reset = document.getElementById("resetBtn");
  if (reset) reset.addEventListener("click", () => {
    if (confirm("Reset ALL progress, reviews, and vocabulary schedules? This cannot be undone.")) {
      state = { completed: {}, reviews: {}, vocab: {}, settings: state.settings, collapsed: {} };
      saveState(); toast("", "Progress reset", "Everything has been cleared."); render();
    }
  });
}
function scrollToSubject(id) {
  state.collapsed["subj:" + id] = false; saveState();
  const el = document.querySelector('[data-subject="' + id + '"]');
  if (el) { el.classList.remove("collapsed"); el.scrollIntoView({ behavior: "smooth", block: "start" }); }
}

/* ---------- Boot ---------- */
applyTheme();
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("notifBtn").addEventListener("click", toggleNotifications);
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
render();

// Periodically re-check for due reviews while the tab is open (keeps badge & notifications fresh)
setInterval(() => { renderBadges(); maybeNotify(); if (activeTab === "review" || activeTab === "dashboard") render(); }, 60 * 1000);
</script>
</body>
</html>
